name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avrix_sidecar_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: avrix_sidecar_backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avrix_desktop_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avrix_desktop_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
