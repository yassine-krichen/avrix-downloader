name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: avrix_sidecar_backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            avrix_desktop_frontend/package-lock.json
            electron/package-lock.json

      - name: Fetch ffmpeg and deno (pinned, checksum-verified)
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1
          ./scripts/fetch-deno.ps1

      - name: Backend tests
        working-directory: avrix_sidecar_backend
        run: |
          pip install -r requirements-dev.txt -r requirements-build.txt
          python -m pytest -q

      - name: Freeze sidecar
        working-directory: avrix_sidecar_backend
        run: pyinstaller sidecar.spec --noconfirm

      - name: Install frontend dependencies
        working-directory: avrix_desktop_frontend
        run: npm ci

      - name: Build installer
        working-directory: electron
        run: |
          npm ci
          npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/Avrix-Setup-*.exe
          generate_release_notes: true
